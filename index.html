<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, WebGL!</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        color: #f8fafc;
        background: #020617;
        font-family: system-ui, sans-serif;
      }
      canvas { width: 100%; height: 100%; display: block; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.4rem;
        text-align: center;
        pointer-events: none;
      }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 5rem); }
      p { margin: 0; color: #94a3b8; }
    </style>
  </head>
  <body>
    <canvas id="webgl" aria-label="Анимированный WebGL-треугольник"></canvas>
    <main>
      <h1>Hello, WebGL!</h1>
      <p>Работает в вашем браузере</p>
    </main>

    <script>
      const canvas = document.querySelector('#webgl');
      const gl = canvas.getContext('webgl');

      if (!gl) {
        document.querySelector('p').textContent = 'WebGL не поддерживается';
        throw new Error('WebGL is not supported');
      }

      const vertexShader = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vertexShader, `
        precision mediump float;
        attribute vec2 position;
        uniform float time;
        void main() {
          float angle = time * 0.7;
          mat2 rotation = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
          gl_Position = vec4(rotation * position, 0.0, 1.0);
        }
      `);
      gl.compileShader(vertexShader);
      if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(vertexShader));
      }

      const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fragmentShader, `
        precision mediump float;
        uniform float time;
        void main() {
          vec3 color = 0.55 + 0.45 * cos(time + vec3(0.0, 2.0, 4.0));
          gl_FragColor = vec4(color, 1.0);
        }
      `);
      gl.compileShader(fragmentShader);
      if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(fragmentShader));
      }

      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);
      document.documentElement.dataset.webgl = 'ready';

      const vertices = new Float32Array([0, 0.65, -0.58, -0.35, 0.58, -0.35]);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

      const position = gl.getAttribLocation(program, 'position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const time = gl.getUniformLocation(program, 'time');

      function resize() {
        const ratio = Math.min(window.devicePixelRatio, 2);
        canvas.width = Math.round(canvas.clientWidth * ratio);
        canvas.height = Math.round(canvas.clientHeight * ratio);
        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      function render(milliseconds) {
        resize();
        gl.clearColor(0.008, 0.024, 0.09, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(time, milliseconds / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    </script>
  </body>
</html>
